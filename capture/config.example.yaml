# Lance On - Court Capture Agent
# Copy to /etc/lance-on/config.yaml on the Raspberry Pi
# Up to 6 cameras per court.

api_url: http://13.210.97.155:8000
device_key: PASTE_DEVICE_KEY_FROM_ADMIN_PANEL

buffer_seconds: 300
clip_seconds: 30
segment_seconds: 10
heartbeat_seconds: 60
button_cooldown_seconds: 3

# Bottom ad banner burned into every uploaded clip
watermark_path: assets/video-watermark.jpeg

# Add 1–6 cameras. Each camera can have its own GPIO button (idle HIGH, press = LOW to GND).
# Default pins: cam1 GPIO17/pin11, cam2 GPIO27/pin13, cam3 GPIO22/pin15, etc.
cameras:
  - index: 1
    name: Camera 1
    rtsp_url: rtsp://admin:password@192.168.1.101:554/cam/realmonitor?channel=1&subtype=0
    button:
      type: gpio
      pin: 17

  - index: 2
    name: Camera 2
    rtsp_url: rtsp://admin:password@192.168.1.102:554/cam/realmonitor?channel=1&subtype=0
    button:
      type: gpio
      pin: 27

  # - index: 3
  #   name: Camera 3
  #   rtsp_url: rtsp://admin:password@192.168.1.103:554/cam/realmonitor?channel=1&subtype=0
  # - index: 4
  #   name: Camera 4
  #   rtsp_url: rtsp://admin:password@192.168.1.104:554/cam/realmonitor?channel=1&subtype=0
  # - index: 5
  #   name: Camera 5
  #   rtsp_url: rtsp://admin:password@192.168.1.105:554/cam/realmonitor?channel=1&subtype=0
  # - index: 6
  #   name: Camera 6
  #   rtsp_url: rtsp://admin:password@192.168.1.106:554/cam/realmonitor?channel=1&subtype=0

data_dir: /var/lib/lance-on
